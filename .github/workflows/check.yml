name: Check listings

on:
  schedule:
    - cron: "3/10 * * * *"   # alle 10 Minuten (GitHub kann Läufe um einige Minuten verzögern)
  workflow_dispatch:
    inputs:
      test:
        description: "Nur eine Test-Push-Nachricht senden"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deal-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Test-Push
        if: ${{ inputs.test }}
        run: python3 monitor.py --test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Neue Anzeigen prüfen
        if: ${{ !inputs.test }}
        run: python3 monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Stand speichern
        if: ${{ always() && !inputs.test }}
        run: |
          git config user.name "deal-alert-bot"
          git config user.email "deal-alert-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || { git commit -m "Update seen.json" && git pull --rebase -q && git push; }
